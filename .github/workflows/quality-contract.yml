name: Quality Contract Adapter

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  quality-contract:
    name: Evaluate canonical contract (report-only until migration)
    runs-on: ubuntu-latest
    steps:
      # Check out the immutable candidate selected by GitHub, never a ref
      # named in repository content. Base/candidate are CI facts only: the
      # facade does not treat them as authorization or a trusted event.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"

      - name: Select trusted base and candidate
        id: subject
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          candidate="$(git rev-parse HEAD)"
          base="$PR_BASE_SHA"
          if [ "$EVENT_NAME" != pull_request ]; then base="$PUSH_BASE_SHA"; fi
          if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            base="$(git rev-parse HEAD^ 2>/dev/null || git hash-object -t tree /dev/null)"
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "candidate=$candidate" >> "$GITHUB_OUTPUT"

      - name: Invoke facade without policy reinterpretation
        env:
          BASE_SHA: ${{ steps.subject.outputs.base }}
          CANDIDATE_SHA: ${{ steps.subject.outputs.candidate }}
        run: |
          set -euo pipefail
          block_count="$(grep -rh --include='*.md' '^```quality-contract-json$' docs/sdd 2>/dev/null | wc -l | tr -d '[:space:]')"
          if [ "$block_count" -eq 0 ]; then
            echo "No canonical quality-contract block: report-only legacy repository."
            exit 0
          fi
          if [ "$block_count" -ne 1 ]; then
            echo "::error::Expected exactly one canonical quality-contract block; found $block_count."
            exit 1
          fi
          contract="$(grep -rl --include='*.md' '^```quality-contract-json$' docs/sdd | head -n 1)"
          printf 'Trusted Git subject selected by CI: base=%s candidate=%s\n' "$BASE_SHA" "$CANDIDATE_SHA"
          # Preserve the facade's status and JSON exactly; this adapter must
          # never upgrade a result or manufacture a dispatch/acceptance claim.
          node tools/quality-contract/quality-contract.mjs "$contract" --json
